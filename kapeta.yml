kind: core/resource-type-operator
metadata:
  name: kapeta/resource-type-postgresql
  title: PostgreSQL
  description: Use PostgreSQL in your plans
  visibility: public
spec:
  icon:
    type: url
    value: https://storage.googleapis.com/kapeta-public-cdn/icons/themed/postgres.svg
  icons:
    - type: url
      value: https://storage.googleapis.com/kapeta-public-cdn/icons/themed/postgres.svg
      theme: light
    - type: url
      value: https://storage.googleapis.com/kapeta-public-cdn/icons/themed/postgres-light.svg
      theme: dark
  ports:
    - type: postgres
  local:
    image: postgres:15.4
    health:
      cmd: psql --user postgres postgres -c 'select true' > /dev/null,
      interval: 5000
    ports:
      postgres:
        port: 5432
        type: tcp
    mounts:
      data: /var/lib/postgresql/data/pgdata
    env:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    credentials:
      username: postgres
      password: postgres
  versioning:
    - paths:
        - spec.models.*.name
        - spec.models.*.type
        - spec.models.*.*.type
        - spec.models.*.*.ref
        - spec.models.*.*.required
        - spec.models.*.*.defaultValue
      on:
        - update
        - delete
      increment: major
  schema:
    type: object
    required:
      - models
      - source
    properties:
      models:
        type: array
        items:
          $ref: /core/entity
      source:
        $ref: /core/source-code

